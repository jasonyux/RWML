[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rwml"
version = "0.1.0"
description = "Reinforcement World Model Learning (RWML) for LLM-based agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cachetools",
    "numpy",
    "openai",
    "rouge-score",
    "tiktoken",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rwml*"]
